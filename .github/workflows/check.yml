name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pluto_demo
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: pluto_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U pluto_demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLUTO_CORE_REQUIRE_DATABASE: "1"
      PLUTO_CORE_CANDIDATE_DATA: "1"
      PLUTO_CORE_TEST_DATABASE_URL: postgres://pluto_demo:local_only@localhost:5432/pluto_demo?sslmode=disable
      PLUTO_CORE_CACHE_TEST_URLS: redis://:synthetic_only@127.0.0.1:6380,redis://:synthetic_only@127.0.0.1:6381
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned candidate companions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone plutoframework/pluto-auth ../pluto-auth
          git -C ../pluto-auth checkout cb55546221727f16a00f88cc24543b380dab5813
          gh repo clone plutoframework/pluto-rbac ../pluto-rbac
          git -C ../pluto-rbac checkout 84ed4e943ff871f34dc1c143186c0c39a7c614bf
          gh repo clone plutoframework/pluto-jobs ../pluto-jobs
          git -C ../pluto-jobs checkout f0ded6880c19b258bb9d747764b161a7f6e2d1ff
      - uses: jdx/mise-action@v3
      - name: Start isolated cache servers
        run: |
          docker run -d --name pluto-ci-valkey -p 127.0.0.1:6380:6379 \
            valkey/valkey:9.1.3-alpine valkey-server --save '' \
            --appendonly no --requirepass synthetic_only
          docker run -d --name pluto-ci-redis -p 127.0.0.1:6381:6379 \
            redis:8.10.3-alpine redis-server --save '' \
            --appendonly no --requirepass synthetic_only
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh -race
      - run: ./scripts/fuzz.sh
      - run: python3 scripts/mutation-smoke.py
      - name: Require isolated PostgreSQL lifecycle and mutation evidence
        run: PLUTO_CORE_SQL_MUTATION=1 ./scripts/postgres-check.sh
      - name: Remove cache servers
        if: always()
        run: docker rm -f pluto-ci-valkey pluto-ci-redis
